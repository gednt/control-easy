<?xml version="1.0" encoding="UTF-8"?>
<!--
  Screen 4: PlatformAdmin creates a new tenant.
  Composed of: ce-sidebar, ce-topbar, ce-breadcrumbs, ce-card, ce-input, ce-button,
  ce-table, ce-pagination, ce-badge, ce-empty-state.
  Role: PlatformAdmin per UC-9 and UC-23.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <title>Screen 4: PlatformAdmin creates a new tenant</title>
  <desc>User journey: PlatformAdmin creates a new tenant (Globex), assigning the first TenantAdmin and a brand color via the --color-primary-raw override hook.</desc>

  <rect width="1440" height="900" fill="#f8fafc"/>

  <!-- sidebar -->
  <rect width="256" height="900" fill="#0f172a"/>
  <text x="20" y="36" font-size="14" font-weight="700" fill="#cbd5e1">ControlEasy</text>
  <text x="20" y="52" font-size="10" fill="#94a3b8">Platform</text>
  <line x1="12" y1="68" x2="244" y2="68" stroke="#1f2937"/>

  <text x="32" y="104" font-size="13" fill="#cbd5e1">Overview</text>
  <rect x="12" y="116" width="232" height="36" rx="8" fill="#4f46e5"/>
  <text x="32" y="140" font-size="13" font-weight="500" fill="#ffffff">Tenants</text>

  <text x="32" y="172" font-size="13" fill="#cbd5e1">Platform users</text>
  <text x="32" y="204" font-size="13" fill="#cbd5e1">Billing</text>
  <text x="32" y="236" font-size="13" fill="#cbd5e1">Audit</text>
  <text x="32" y="268" font-size="13" fill="#cbd5e1">Settings</text>

  <line x1="12" y1="780" x2="244" y2="780" stroke="#1f2937"/>
  <circle cx="36" cy="820" r="16" fill="#4f46e5"/>
  <text x="36" y="824" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">PA</text>
  <text x="60" y="816" font-size="12" font-weight="500" fill="#cbd5e1">Platform Admin</text>
  <text x="60" y="832" font-size="10" fill="#94a3b8">All tenants</text>

  <!-- topbar -->
  <rect x="256" width="1184" height="64" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="28" font-size="10" font-weight="500" fill="#94a3b8" letter-spacing="0.04em">PLATFORM</text>
  <text x="280" y="46" font-size="13" font-weight="600" fill="#0f172a">Tenants / Create new tenant</text>
  <rect x="900" y="16" width="200" height="32" rx="8" fill="#f1f5f9"/>
  <text x="916" y="36" font-size="12" fill="#94a3b8">Search tenants...</text>
  <circle cx="1156" cy="32" r="14" fill="#eef2ff"/>
  <text x="1156" y="36" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">v</text>
  <circle cx="1196" cy="32" r="14" fill="#4f46e5"/>
  <text x="1196" y="36" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">PA</text>

  <!-- form card -->
  <g transform="translate(280,96)">
    <rect width="800" height="780" rx="16" fill="#ffffff"/>
    <text x="24" y="36" font-size="16" font-weight="600" fill="#0f172a">Create new tenant</text>
    <text x="24" y="56" font-size="12" fill="#475569">A tenant is an isolated condominium. The first TenantAdmin receives an invite email.</text>
    <line x1="24" y1="76" x2="776" y2="76" stroke="#e2e8f0"/>

    <!-- tenant name -->
    <text x="24" y="116" font-size="12" font-weight="500" fill="#0f172a">Tenant name *</text>
    <rect x="24" y="124" width="376" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="36" y="148" font-size="13" fill="#0f172a">Globex Residence</text>

    <!-- slug -->
    <text x="424" y="116" font-size="12" font-weight="500" fill="#0f172a">Slug *</text>
    <rect x="424" y="124" width="352" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="436" y="148" font-size="13" fill="#0f172a">globex</text>
    <text x="436" y="172" font-size="11" fill="#94a3b8">URL: controlease.app/t/globex</text>

    <!-- brand color -->
    <text x="24" y="216" font-size="12" font-weight="500" fill="#0f172a">Brand color</text>
    <text x="24" y="232" font-size="11" fill="#475569">Sets --color-primary-raw for this tenant. Default indigo.</text>
    <rect x="24" y="240" width="60" height="40" rx="12" fill="#db2777"/>
    <text x="92" y="260" font-size="13" fill="#0f172a">#db2777 (pink)</text>
    <text x="92" y="276" font-size="11" fill="#94a3b8">Preview: tenant uses pink as primary; badge, button, focus ring all change.</text>

    <text x="424" y="216" font-size="12" font-weight="500" fill="#0f172a">Logo (optional)</text>
    <rect x="424" y="240" width="352" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-dasharray="4 4"/>
    <text x="600" y="266" font-size="12" fill="#94a3b8" text-anchor="middle">Drop a SVG / PNG</text>

    <!-- first admin -->
    <text x="24" y="328" font-size="12" font-weight="500" fill="#0f172a">First TenantAdmin *</text>
    <rect x="24" y="336" width="376" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="36" y="360" font-size="13" fill="#0f172a">admin@globex.com.br</text>
    <text x="424" y="328" font-size="12" font-weight="500" fill="#0f172a">Full name</text>
    <rect x="424" y="336" width="352" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="436" y="360" font-size="13" fill="#0f172a">Sandra Oliveira</text>

    <!-- plan -->
    <text x="24" y="416" font-size="12" font-weight="500" fill="#0f172a">Plan *</text>
    <rect x="24" y="424" width="248" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="36" y="448" font-size="13" fill="#0f172a">Pilot (90 days)</text>
    <text x="288" y="416" font-size="12" font-weight="500" fill="#0f172a">Max residents</text>
    <rect x="288" y="424" width="120" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="300" y="448" font-size="13" fill="#0f172a">500</text>
    <text x="424" y="416" font-size="12" font-weight="500" fill="#0f172a">Max attendants</text>
    <rect x="424" y="424" width="120" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="456" y="448" font-size="13" fill="#0f172a">10</text>
    <text x="560" y="416" font-size="12" font-weight="500" fill="#0f172a">Storage GB</text>
    <rect x="560" y="424" width="120" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="620" y="448" font-size="13" fill="#0f172a">25</text>

    <!-- isolation card preview -->
    <text x="24" y="504" font-size="12" font-weight="500" fill="#0f172a">Data isolation preview</text>
    <g transform="translate(24,512)">
      <rect width="752" height="92" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
      <text x="20" y="28" font-size="13" font-weight="600" fill="#0f172a">Automatic tenant_id filter</text>
      <text x="20" y="50" font-size="12" fill="#0f172a">Every Linq&lt;T&gt; query will inject WHERE tenant_id = :tenant_id. Application code</text>
      <text x="20" y="68" font-size="12" fill="#0f172a">cannot bypass tenant isolation. Verified by tests in 2 - data-access spec.</text>
    </g>

    <!-- actions -->
    <line x1="24" y1="640" x2="776" y2="640" stroke="#e2e8f0"/>
    <rect x="560" y="660" width="100" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="610" y="684" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Save draft</text>
    <rect x="668" y="660" width="108" height="40" rx="12" fill="#4f46e5"/>
    <text x="722" y="684" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">Create tenant</text>
  </g>

  <!-- right column: existing tenants -->
  <g transform="translate(1100,96)">
    <rect width="308" height="380" rx="16" fill="#ffffff"/>
    <text x="20" y="32" font-size="14" font-weight="600" fill="#0f172a">Existing tenants (2)</text>
    <line x1="20" y1="48" x2="288" y2="48" stroke="#e2e8f0"/>

    <text x="20" y="76" font-size="12" font-weight="600" fill="#0f172a">Acme Condominium</text>
    <text x="20" y="94" font-size="12" fill="#475569">Slug: acme - 312 residents</text>
    <rect x="20" y="104" width="68" height="20" rx="10" fill="#dcfce7"/>
    <text x="54" y="118" font-size="11" font-weight="500" fill="#22c55e" text-anchor="middle">Active</text>

    <text x="20" y="148" font-size="12" font-weight="600" fill="#0f172a">Initech Towers</text>
    <text x="20" y="166" font-size="12" fill="#475569">Slug: initech - 87 residents</text>
    <rect x="20" y="176" width="80" height="20" rx="10" fill="#fef3c7"/>
    <text x="60" y="190" font-size="11" font-weight="500" fill="#f59e0b" text-anchor="middle">Pilot</text>
  </g>

  <!-- annotation -->
  <g transform="translate(20,860)">
    <text x="0" y="0" font-size="11" fill="#475569">Screen 4 - PlatformAdmin creates a new tenant. User: PlatformAdmin. Components: ce-sidebar + ce-topbar + ce-breadcrumbs (Tenants / Create new tenant) + ce-card (form) + ce-input x8 + ce-button (Save draft / Create tenant) + ce-card (data isolation preview) + ce-card (existing tenants list) + ce-badge (status). Brand color is wired to --color-primary-raw per UC-033.</text>
  </g>
</svg>
