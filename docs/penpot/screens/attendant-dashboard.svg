<?xml version="1.0" encoding="UTF-8"?>
<!--
  Screen 1: Attendant dashboard, with the "open a new visit" modal open.
  Composed exclusively of design-system components: ce-sidebar, ce-topbar, ce-stat-tile,
  ce-card, ce-button, ce-modal, ce-breadcrumbs, ce-avatar, ce-dropdown (closed).
  Role: AttendantProfile (per .specs/1 - modernization-roadmap/requirements.md UC-9).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <title>Screen 1: Attendant dashboard - opening a new visit</title>
  <desc>User journey: AttendantProfile (Attendant) sees the dashboard and clicks the "Open new visit" button to start a visitor flow.</desc>

  <rect width="1440" height="900" fill="#f8fafc"/>

  <!-- sidebar -->
  <rect width="256" height="900" fill="#0f172a"/>
  <text x="20" y="36" font-size="14" font-weight="700" fill="#cbd5e1">ControlEasy</text>
  <text x="20" y="52" font-size="10" fill="#94a3b8">Condominium access</text>
  <line x1="12" y1="68" x2="244" y2="68" stroke="#1f2937"/>

  <rect x="12" y="80" width="232" height="36" rx="8" fill="#4f46e5"/>
  <text x="32" y="104" font-size="13" font-weight="500" fill="#ffffff">Dashboard</text>

  <text x="32" y="140" font-size="13" fill="#cbd5e1">Residents</text>
  <text x="32" y="172" font-size="13" fill="#cbd5e1">Visits</text>
  <text x="32" y="204" font-size="13" fill="#cbd5e1">Vehicles</text>
  <text x="32" y="236" font-size="13" fill="#cbd5e1">Service providers</text>
  <text x="32" y="268" font-size="13" fill="#cbd5e1">Administration</text>
  <text x="32" y="300" font-size="13" fill="#cbd5e1">Settings</text>

  <line x1="12" y1="780" x2="244" y2="780" stroke="#1f2937"/>
  <circle cx="36" cy="820" r="16" fill="#4f46e5"/>
  <text x="36" y="824" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">AT</text>
  <text x="60" y="816" font-size="12" font-weight="500" fill="#cbd5e1">Andre Torres</text>
  <text x="60" y="832" font-size="10" fill="#94a3b8">Attendant - Day shift</text>
  <text x="60" y="848" font-size="10" fill="#94a3b8">Gate A - Tenant: Acme</text>

  <!-- topbar -->
  <rect x="256" width="1184" height="64" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="38" font-size="12" fill="#475569">Dashboard</text>
  <rect x="900" y="16" width="200" height="32" rx="8" fill="#f1f5f9"/>
  <text x="916" y="36" font-size="12" fill="#94a3b8">Search residents, visits...</text>
  <circle cx="1156" cy="32" r="14" fill="#eef2ff"/>
  <text x="1156" y="36" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">v</text>
  <circle cx="1196" cy="32" r="14" fill="#4f46e5"/>
  <text x="1196" y="36" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">AT</text>

  <!-- main -->
  <text x="280" y="100" font-size="20" font-weight="600" fill="#0f172a">Welcome, Andre</text>
  <text x="280" y="120" font-size="13" fill="#475569">Tuesday, June 11 - Day shift 07:00-19:00 - Gate A</text>

  <!-- primary CTA: open new visit -->
  <g transform="translate(900,84)">
    <rect width="180" height="36" rx="8" fill="#4f46e5"/>
    <text x="90" y="22" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">+ Open new visit</text>
  </g>

  <!-- stat tiles (4) -->
  <g transform="translate(280,140)">
    <rect width="270" height="100" rx="16" fill="#ffffff"/>
    <text x="16" y="28" font-size="11" font-weight="500" fill="#475569">VISITS TODAY</text>
    <text x="16" y="64" font-size="24" font-weight="700" fill="#0f172a">42</text>
    <rect x="16" y="74" width="64" height="20" rx="10" fill="#dcfce7"/>
    <text x="48" y="88" font-size="11" font-weight="500" fill="#22c55e" text-anchor="middle">+12% wow</text>
  </g>
  <g transform="translate(566,140)">
    <rect width="270" height="100" rx="16" fill="#ffffff"/>
    <text x="16" y="28" font-size="11" font-weight="500" fill="#475569">EXPECTED (PRE-REGISTERED)</text>
    <text x="16" y="64" font-size="24" font-weight="700" fill="#0f172a">17</text>
    <text x="16" y="86" font-size="11" fill="#475569">3 arriving in next hour</text>
  </g>
  <g transform="translate(852,140)">
    <rect width="270" height="100" rx="16" fill="#ffffff"/>
    <text x="16" y="28" font-size="11" font-weight="500" fill="#475569">DENIED</text>
    <text x="16" y="64" font-size="24" font-weight="700" fill="#0f172a">3</text>
    <rect x="16" y="74" width="48" height="20" rx="10" fill="#fee2e2"/>
    <text x="40" y="88" font-size="11" font-weight="500" fill="#ef4444" text-anchor="middle">-1</text>
  </g>
  <g transform="translate(1138,140)">
    <rect width="270" height="100" rx="16" fill="#ffffff"/>
    <text x="16" y="28" font-size="11" font-weight="500" fill="#475569">ON-SHIFT</text>
    <text x="16" y="64" font-size="24" font-weight="700" fill="#0f172a">5</text>
    <text x="16" y="86" font-size="11" fill="#475569">attendants</text>
  </g>

  <!-- recent visits card -->
  <g transform="translate(280,260)">
    <rect width="1128" height="220" rx="16" fill="#ffffff"/>
    <text x="20" y="32" font-size="14" font-weight="600" fill="#0f172a">Recent visits</text>
    <line x1="20" y1="44" x2="1108" y2="44" stroke="#e2e8f0"/>
    <text x="20" y="68" font-size="12" fill="#0f172a">14:32</text>
    <text x="80" y="68" font-size="12" fill="#0f172a">Carlos Souza</text>
    <text x="200" y="68" font-size="12" fill="#475569">RG 12.345.678</text>
    <text x="340" y="68" font-size="12" fill="#475569">102-A</text>
    <text x="440" y="68" font-size="12" fill="#475569">Maria Silva (Morador)</text>
    <rect x="620" y="56" width="68" height="20" rx="10" fill="#dcfce7"/>
    <text x="654" y="70" font-size="11" font-weight="500" fill="#22c55e" text-anchor="middle">Approved</text>

    <text x="20" y="100" font-size="12" fill="#0f172a">14:18</text>
    <text x="80" y="100" font-size="12" fill="#0f172a">Delivery: Mercado Central</text>
    <text x="340" y="100" font-size="12" fill="#475569">501</text>
    <text x="440" y="100" font-size="12" fill="#475569">Carla Souza (Morador)</text>
    <rect x="620" y="88" width="68" height="20" rx="10" fill="#dcfce7"/>
    <text x="654" y="102" font-size="11" font-weight="500" fill="#22c55e" text-anchor="middle">Approved</text>

    <text x="20" y="132" font-size="12" fill="#0f172a">14:02</text>
    <text x="80" y="132" font-size="12" fill="#0f172a">Plumber Joao</text>
    <text x="340" y="132" font-size="12" fill="#475569">204-C</text>
    <text x="440" y="132" font-size="12" fill="#475569">Roberto Lima (Morador)</text>
    <rect x="620" y="120" width="68" height="20" rx="10" fill="#dbeafe"/>
    <text x="654" y="134" font-size="11" font-weight="500" fill="#3b82f6" text-anchor="middle">Service</text>

    <text x="20" y="164" font-size="12" fill="#0f172a">13:50</text>
    <text x="80" y="164" font-size="12" fill="#0f172a">Uber Eats (Maria)</text>
    <text x="340" y="164" font-size="12" fill="#475569">102-A</text>
    <text x="440" y="164" font-size="12" fill="#475569">Maria Silva (Morador)</text>
    <rect x="620" y="152" width="68" height="20" rx="10" fill="#dcfce7"/>
    <text x="654" y="166" font-size="11" font-weight="500" fill="#22c55e" text-anchor="middle">Approved</text>

    <text x="20" y="196" font-size="12" fill="#0f172a">13:31</text>
    <text x="80" y="196" font-size="12" fill="#0f172a">Unknown</text>
    <text x="340" y="196" font-size="12" fill="#475569">---</text>
    <text x="440" y="196" font-size="12" fill="#475569">no authorization</text>
    <rect x="620" y="184" width="68" height="20" rx="10" fill="#fee2e2"/>
    <text x="654" y="198" font-size="11" font-weight="500" fill="#ef4444" text-anchor="middle">Denied</text>
  </g>

  <!-- "Open new visit" modal (opened by CTA) -->
  <rect x="0" y="0" width="1440" height="900" fill="#0b1020" opacity="0.4"/>

  <g transform="translate(440,180)">
    <rect width="560" height="500" rx="16" fill="#ffffff"/>
    <text x="24" y="36" font-size="16" font-weight="600" fill="#0f172a">Open new visit</text>
    <line x1="24" y1="56" x2="536" y2="56" stroke="#e2e8f0"/>

    <text x="24" y="92" font-size="12" font-weight="500" fill="#0f172a">Visitor name *</text>
    <rect x="24" y="100" width="512" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="36" y="124" font-size="13" fill="#0f172a">Carlos Souza</text>
    <line x1="24" y1="100" x2="36" y2="100" stroke="#4f46e5" stroke-width="2"/>

    <text x="24" y="160" font-size="12" font-weight="500" fill="#0f172a">Document (RG / CPF)</text>
    <rect x="24" y="168" width="248" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="36" y="192" font-size="13" fill="#0f172a">12.345.678-90</text>

    <text x="288" y="160" font-size="12" font-weight="500" fill="#0f172a">Type</text>
    <rect x="288" y="168" width="248" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="300" y="192" font-size="13" fill="#0f172a">Visit (not pre-registered)</text>

    <text x="24" y="228" font-size="12" font-weight="500" fill="#0f172a">Apartment to visit *</text>
    <rect x="24" y="236" width="248" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="36" y="260" font-size="13" fill="#0f172a">102-A</text>
    <text x="36" y="282" font-size="11" fill="#22c55e">Maria Silva confirmed by phone at 14:31</text>

    <text x="288" y="228" font-size="12" font-weight="500" fill="#0f172a">Authorized by</text>
    <rect x="288" y="236" width="248" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="300" y="260" font-size="13" fill="#0f172a">Morador phone</text>

    <text x="24" y="312" font-size="12" font-weight="500" fill="#0f172a">Notes</text>
    <rect x="24" y="320" width="512" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="36" y="340" font-size="12" fill="#94a3b8">Optional notes...</text>

    <line x1="24" y1="404" x2="536" y2="404" stroke="#e2e8f0"/>
    <rect x="380" y="424" width="76" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="418" y="448" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Cancel</text>
    <rect x="464" y="424" width="72" height="40" rx="12" fill="#4f46e5"/>
    <text x="500" y="448" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">Open</text>
  </g>

  <!-- annotation -->
  <g transform="translate(20,860)">
    <text x="0" y="0" font-size="11" fill="#475569">Screen 1 - Attendant dashboard (AttendantProfile). User: Attendant on Day shift, Gate A. Components: ce-sidebar + ce-topbar + ce-stat-tile x4 + ce-card + ce-button (CTA) + ce-modal (open). User action: clicks + Open new visit -&gt; modal opens with pre-validated apartment after attendant confirmed by phone. a11y: modal role=dialog, aria-modal=true, focus trapped on the form.</text>
  </g>
</svg>
