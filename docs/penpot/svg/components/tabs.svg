<?xml version="1.0" encoding="UTF-8"?>
<!--
  ce-tabs
  Source: design.md (ce-tabs section) - UC-020
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" font-family="Inter, system-ui, sans-serif">
  <title>ce-tabs - Component Reference</title>
  <desc>WAI-ARIA tabs pattern. Roving tabindex, arrow-key navigation, animated underline. ARIA: tablist / tab / tabpanel.</desc>

  <rect width="1280" height="280" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#0f172a">ce-tabs</text>
  <text x="40" y="72" font-size="14" fill="#475569">ARIA: tablist / tab / tabpanel  |  keyboard: ArrowLeft/Right move+activate, Home/End first/last  |  UC-020</text>

  <!-- tablist -->
  <g transform="translate(40,110)">
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#e2e8f0"/>
    <text x="20" y="32" font-size="14" font-weight="600" fill="#0f172a">Overview</text>
    <line x1="0" y1="44" x2="100" y2="44" stroke="#4f46e5" stroke-width="2"/>
    <text x="160" y="32" font-size="14" font-weight="500" fill="#475569">Residents</text>
    <text x="280" y="32" font-size="14" font-weight="500" fill="#475569">Visits</text>
    <text x="360" y="32" font-size="14" font-weight="500" fill="#475569">Vehicles</text>
    <text x="460" y="32" font-size="14" font-weight="500" fill="#475569">Service providers</text>
  </g>

  <!-- tab content -->
  <g transform="translate(40,180)">
    <rect width="1200" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="38" font-size="13" fill="#475569">Overview content - 312 residents, 18 service providers, 7 active visits today.</text>
  </g>

  <g transform="translate(40,250)">
    <text x="0" y="0" font-size="12" fill="#475569">Tokens: --color-primary underline 2px, --duration-fast 120ms underline transition, --font-weight-semibold active tab</text>
  </g>
</svg>
