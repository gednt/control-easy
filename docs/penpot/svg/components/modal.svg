<?xml version="1.0" encoding="UTF-8"?>
<!--
  ce-modal - Open state, all four sizes
  Source: design.md (ce-modal section) - UC-014
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, system-ui, sans-serif">
  <title>ce-modal - Component Reference</title>
  <desc>Built on Angular CDK Overlay with cdkTrapFocus. Sizes: sm 384, md 512, lg 672, xl 896. Closes on Escape and backdrop click, restores focus to trigger.</desc>

  <rect width="1280" height="720" fill="#0b1020" opacity="0.5"/>
  <rect width="1280" height="720" fill="#0b1020" opacity="0.3"/>

  <text x="40" y="40" font-size="20" font-weight="600" fill="#f1f5f9">ce-modal (sm 384)</text>

  <g transform="translate(40,80)">
    <rect width="384" height="240" rx="16" fill="#ffffff"/>
    <text x="24" y="36" font-size="16" font-weight="600" fill="#0f172a">Open new visit</text>
    <line x1="24" y1="56" x2="360" y2="56" stroke="#e2e8f0"/>
    <text x="24" y="84" font-size="13" fill="#475569">Visitor name</text>
    <rect x="24" y="92" width="336" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="36" y="114" font-size="13" fill="#94a3b8">Type a name...</text>
    <line x1="24" y1="156" x2="360" y2="156" stroke="#e2e8f0"/>
    <rect x="232" y="180" width="60" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="262" y="200" font-size="13" fill="#0f172a" text-anchor="middle">Cancel</text>
    <rect x="300" y="180" width="60" height="32" rx="8" fill="#4f46e5"/>
    <text x="330" y="200" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">Open</text>
  </g>

  <text x="460" y="40" font-size="20" font-weight="600" fill="#f1f5f9">ce-modal (md 512)</text>
  <g transform="translate(460,80)">
    <rect width="512" height="320" rx="16" fill="#ffffff"/>
    <text x="24" y="36" font-size="16" font-weight="600" fill="#0f172a">Visitor details</text>
    <line x1="24" y1="56" x2="488" y2="56" stroke="#e2e8f0"/>
    <text x="24" y="84" font-size="13" fill="#475569">Document</text>
    <rect x="24" y="92" width="464" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="36" y="114" font-size="13" fill="#0f172a">123.456.789-00</text>
    <text x="24" y="144" font-size="13" fill="#475569">Apartment</text>
    <rect x="24" y="152" width="220" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="36" y="174" font-size="13" fill="#0f172a">302-B</text>
    <text x="264" y="144" font-size="13" fill="#475569">Authorized by</text>
    <rect x="264" y="152" width="224" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="276" y="174" font-size="13" fill="#0f172a">Maria Silva (Morador)</text>
    <line x1="24" y1="220" x2="488" y2="220" stroke="#e2e8f0"/>
    <rect x="360" y="244" width="60" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="390" y="264" font-size="13" fill="#0f172a" text-anchor="middle">Cancel</text>
    <rect x="428" y="244" width="60" height="32" rx="8" fill="#4f46e5"/>
    <text x="458" y="264" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">Save</text>
  </g>

  <text x="1000" y="40" font-size="20" font-weight="600" fill="#f1f5f9">ce-modal (lg 672)</text>
  <g transform="translate(1000,80)">
    <rect width="240" height="320" rx="16" fill="#ffffff"/>
    <text x="20" y="32" font-size="14" font-weight="600" fill="#0f172a">Add attendant</text>
    <line x1="20" y1="48" x2="220" y2="48" stroke="#e2e8f0"/>
    <text x="20" y="80" font-size="11" fill="#475569">Name</text>
    <rect x="20" y="88" width="200" height="28" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="138" font-size="11" fill="#475569">Shift</text>
    <rect x="20" y="146" width="200" height="28" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="196" font-size="11" fill="#475569">Gatehouse</text>
    <rect x="20" y="204" width="200" height="28" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="120" y="260" width="50" height="28" rx="8" fill="#4f46e5"/>
    <text x="145" y="278" font-size="11" fill="#ffffff" text-anchor="middle">Add</text>
  </g>

  <text x="40" y="460" font-size="20" font-weight="600" fill="#f1f5f9">ce-modal (xl 896)</text>
  <g transform="translate(40,500)">
    <rect width="896" height="200" rx="16" fill="#ffffff"/>
    <text x="24" y="36" font-size="16" font-weight="600" fill="#0f172a">Create new tenant</text>
    <line x1="24" y1="56" x2="872" y2="56" stroke="#e2e8f0"/>
    <text x="24" y="84" font-size="13" fill="#475569">Tenant name</text>
    <rect x="24" y="92" width="280" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="320" y="84" font-size="13" fill="#475569">Slug</text>
    <rect x="320" y="92" width="220" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="556" y="84" font-size="13" fill="#475569">Brand color</text>
    <rect x="556" y="92" width="60" height="36" rx="8" fill="#4f46e5"/>
    <text x="640" y="84" font-size="13" fill="#475569">Admin email</text>
    <rect x="640" y="92" width="232" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <g transform="translate(40,720)">
    <rect width="1200" height="0" fill="none"/>
  </g>

  <!-- A11y -->
  <g transform="translate(0,712)">
    <rect width="1280" height="0" fill="none"/>
  </g>
</svg>
