<?xml version="1.0" encoding="UTF-8"?>
<!--
  ce-avatar
  Source: design.md (ce-avatar section) - UC-019
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" width="1280" height="240" font-family="Inter, system-ui, sans-serif">
  <title>ce-avatar - Component Reference</title>
  <desc>Circular image-or-initials avatar. Initials on deterministic background hashed from name. Sizes 24/32/40/48/64.</desc>

  <rect width="1280" height="240" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#0f172a">ce-avatar</text>
  <text x="40" y="72" font-size="14" fill="#475569">props: src, name, size  |  UC-019</text>

  <!-- sizes with initials -->
  <g transform="translate(60,120)">
    <circle cx="12" cy="12" r="12" fill="#4f46e5"/>
    <text x="12" y="16" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">MS</text>
    <text x="12" y="44" font-size="11" fill="#475569" text-anchor="middle">xs 24</text>
  </g>

  <g transform="translate(120,112)">
    <circle cx="16" cy="16" r="16" fill="#22c55e"/>
    <text x="16" y="20" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">JP</text>
    <text x="16" y="52" font-size="11" fill="#475569" text-anchor="middle">sm 32</text>
  </g>

  <g transform="translate(200,104)">
    <circle cx="20" cy="20" r="20" fill="#f59e0b"/>
    <text x="20" y="26" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">CS</text>
    <text x="20" y="60" font-size="11" fill="#475569" text-anchor="middle">md 40</text>
  </g>

  <g transform="translate(290,96)">
    <circle cx="24" cy="24" r="24" fill="#3b82f6"/>
    <text x="24" y="30" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">RL</text>
    <text x="24" y="68" font-size="11" fill="#475569" text-anchor="middle">lg 48</text>
  </g>

  <g transform="translate(390,80)">
    <circle cx="32" cy="32" r="32" fill="#ef4444"/>
    <text x="32" y="40" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">AT</text>
    <text x="32" y="84" font-size="11" fill="#475569" text-anchor="middle">xl 64</text>
  </g>

  <!-- in user menu -->
  <g transform="translate(540,120)">
    <rect width="200" height="48" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="24" cy="24" r="16" fill="#4f46e5"/>
    <text x="24" y="28" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">MS</text>
    <text x="48" y="22" font-size="13" font-weight="500" fill="#0f172a">Maria Silva</text>
    <text x="48" y="38" font-size="11" fill="#475569">TenantAdmin</text>
  </g>

  <g transform="translate(40,210)">
    <text x="0" y="0" font-size="12" fill="#475569">role: img  |  alt=user name  |  initials: first letter of up to two words  |  background: deterministic from name hash  |  Token: --radius-full</text>
  </g>
</svg>
