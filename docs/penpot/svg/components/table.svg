<?xml version="1.0" encoding="UTF-8"?>
<!--
  ce-table - Sample data table
  Source: design.md (ce-table section) - UC-016
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" font-family="Inter, system-ui, sans-serif">
  <title>ce-table - Component Reference</title>
  <desc>Presentational wrapper. Sticky thead, row hover, cell padding --space-3 --space-4. Sort lives in ce-pagination, not here.</desc>

  <rect width="1280" height="480" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#0f172a">ce-table</text>
  <text x="40" y="72" font-size="14" fill="#475569">presentational wrapper around native table  |  sticky thead, hover row  |  UC-016</text>

  <g transform="translate(40,110)">
    <rect width="1200" height="40" fill="#ffffff"/>
    <text x="20" y="26" font-size="12" font-weight="600" fill="#0f172a" text-transform="uppercase">Name</text>
    <text x="240" y="26" font-size="12" font-weight="600" fill="#0f172a">Apartment</text>
    <text x="420" y="26" font-size="12" font-weight="600" fill="#0f172a">Phone</text>
    <text x="600" y="26" font-size="12" font-weight="600" fill="#0f172a">Status</text>
    <text x="800" y="26" font-size="12" font-weight="600" fill="#0f172a">Created</text>
    <text x="1000" y="26" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">Actions</text>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#e2e8f0"/>
  </g>

  <!-- rows -->
  <g transform="translate(40,150)">
    <rect width="1200" height="48" fill="#ffffff"/>
    <text x="20" y="30" font-size="13" fill="#0f172a">Maria Silva</text>
    <text x="240" y="30" font-size="13" fill="#0f172a">302-B</text>
    <text x="420" y="30" font-size="13" fill="#0f172a">+55 11 9...</text>
    <rect x="600" y="14" width="68" height="20" rx="10" fill="#dcfce7"/>
    <text x="634" y="28" font-size="11" font-weight="500" fill="#22c55e" text-anchor="middle">Active</text>
    <text x="800" y="30" font-size="13" fill="#475569">2025-09-12</text>
    <text x="1000" y="30" font-size="13" fill="#4f46e5" text-anchor="end">Edit</text>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#e2e8f0"/>
  </g>

  <g transform="translate(40,198)">
    <rect width="1200" height="48" fill="#f1f5f9" opacity="0.5"/>
    <text x="20" y="30" font-size="13" fill="#0f172a">Joao Pereira</text>
    <text x="240" y="30" font-size="13" fill="#0f172a">102-A</text>
    <text x="420" y="30" font-size="13" fill="#0f172a">+55 11 9...</text>
    <rect x="600" y="14" width="68" height="20" rx="10" fill="#dcfce7"/>
    <text x="634" y="28" font-size="11" font-weight="500" fill="#22c55e" text-anchor="middle">Active</text>
    <text x="800" y="30" font-size="13" fill="#475569">2024-03-04</text>
    <text x="1000" y="30" font-size="13" fill="#4f46e5" text-anchor="end">Edit</text>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#e2e8f0"/>
  </g>

  <g transform="translate(40,246)">
    <rect width="1200" height="48" fill="#ffffff"/>
    <text x="20" y="30" font-size="13" fill="#0f172a">Carla Souza</text>
    <text x="240" y="30" font-size="13" fill="#0f172a">501</text>
    <text x="420" y="30" font-size="13" fill="#0f172a">+55 11 9...</text>
    <rect x="600" y="14" width="68" height="20" rx="10" fill="#fef3c7"/>
    <text x="634" y="28" font-size="11" font-weight="500" fill="#f59e0b" text-anchor="middle">Pending</text>
    <text x="800" y="30" font-size="13" fill="#475569">2026-05-21</text>
    <text x="1000" y="30" font-size="13" fill="#4f46e5" text-anchor="end">Edit</text>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#e2e8f0"/>
  </g>

  <g transform="translate(40,294)">
    <rect width="1200" height="48" fill="#ffffff"/>
    <text x="20" y="30" font-size="13" fill="#0f172a">Roberto Lima</text>
    <text x="240" y="30" font-size="13" fill="#0f172a">204-C</text>
    <text x="420" y="30" font-size="13" fill="#0f172a">+55 11 9...</text>
    <rect x="600" y="14" width="68" height="20" rx="10" fill="#fee2e2"/>
    <text x="634" y="28" font-size="11" font-weight="500" fill="#ef4444" text-anchor="middle">Suspended</text>
    <text x="800" y="30" font-size="13" fill="#475569">2023-11-19</text>
    <text x="1000" y="30" font-size="13" fill="#4f46e5" text-anchor="end">Edit</text>
  </g>

  <g transform="translate(40,360)">
    <rect width="1200" height="80" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="20" y="32" font-size="14" font-weight="600" fill="#0f172a">Accessibility &amp; behavior</text>
    <text x="20" y="56" font-size="12" fill="#0f172a">role: table (native). &lt;th scope=col&gt; always set. Row hover: bg-surface/50. Sticky thead on overflow.</text>
    <text x="20" y="74" font-size="12" fill="#0f172a">Sort and pagination are out of scope (live in ce-pagination). Cell padding: --space-3 --space-4.</text>
  </g>
</svg>
