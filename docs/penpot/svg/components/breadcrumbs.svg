<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" width="1280" height="200" font-family="Inter, system-ui, sans-serif">
  <title>ce-breadcrumbs - Component Reference</title>
  <desc>Trail fed by router data.breadcrumb. ARIA: nav aria-label=Breadcrumb, ol, aria-current=page on last item.</desc>

  <rect width="1280" height="200" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#0f172a">ce-breadcrumbs</text>
  <text x="40" y="72" font-size="14" fill="#475569">reads data.breadcrumb from each activated route  |  optional crumbs input override  |  UC-024</text>

  <!-- breadcrumbs -->
  <g transform="translate(40,120)">
    <text x="0" y="16" font-size="13" fill="#4f46e5">Dashboard</text>
    <text x="84" y="16" font-size="13" fill="#94a3b8">/</text>
    <text x="100" y="16" font-size="13" fill="#4f46e5">Residents</text>
    <text x="184" y="16" font-size="13" fill="#94a3b8">/</text>
    <text x="200" y="16" font-size="13" fill="#4f46e5">Maria Silva</text>
    <text x="296" y="16" font-size="13" fill="#94a3b8">/</text>
    <text x="312" y="16" font-size="13" font-weight="600" fill="#0f172a">Edit</text>
  </g>

  <g transform="translate(40,170)">
    <text x="0" y="0" font-size="12" fill="#475569">role: nav  |  aria-label=Breadcrumb  |  ol ordered list  |  last item: aria-current=page  |  dividers via ::before or trailing slash</text>
  </g>
</svg>
