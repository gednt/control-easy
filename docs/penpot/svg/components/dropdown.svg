<?xml version="1.0" encoding="UTF-8"?>
<!--
  ce-dropdown - closed and open states
  Source: design.md (ce-dropdown section) - UC-021
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="Inter, system-ui, sans-serif">
  <title>ce-dropdown - Component Reference</title>
  <desc>Accessible menu via CDK Overlay. Up/Down navigate, Enter/Space activate, Escape close. ARIA: menu / menuitem.</desc>

  <rect width="1280" height="360" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#0f172a">ce-dropdown</text>
  <text x="40" y="72" font-size="14" fill="#475569">ARIA: menu / menuitem  |  keyboard: Up/Down navigate, Enter/Space activate, Escape close  |  UC-021</text>

  <!-- closed state (trigger) -->
  <g transform="translate(40,120)">
    <rect width="160" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="20" cy="20" r="14" fill="#4f46e5"/>
    <text x="20" y="24" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">MS</text>
    <text x="44" y="24" font-size="13" fill="#0f172a">Maria</text>
    <text x="148" y="20" font-size="10" fill="#475569" text-anchor="end">v</text>
    <text x="80" y="60" font-size="11" fill="#475569" text-anchor="middle">closed (trigger)</text>
  </g>

  <!-- open state -->
  <g transform="translate(40,200)">
    <rect width="160" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="20" cy="20" r="14" fill="#4f46e5"/>
    <text x="20" y="24" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">MS</text>
    <text x="44" y="24" font-size="13" fill="#0f172a">Maria</text>
    <text x="148" y="20" font-size="10" fill="#475569" text-anchor="end">^</text>

    <rect y="44" width="220" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="68" font-size="13" fill="#0f172a">Profile</text>
    <text x="20" y="92" font-size="13" fill="#0f172a">Settings</text>
    <line x1="20" y1="108" x2="200" y2="108" stroke="#e2e8f0"/>
    <text x="20" y="130" font-size="13" fill="#ef4444">Sign out</text>
    <text x="20" y="170" font-size="13" fill="#0f172a">Help</text>
  </g>

  <g transform="translate(340,120)">
    <rect width="900" height="200" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="20" y="32" font-size="14" font-weight="600" fill="#0f172a">Accessibility &amp; behavior</text>
    <text x="20" y="60" font-size="12" fill="#0f172a">Trigger: ceDropdownTrigger directive on a button. CDK Overlay anchors menu under trigger.</text>
    <text x="20" y="80" font-size="12" fill="#0f172a">Keyboard: Up/Down navigate items, Enter/Space activate, Escape close, Tab close.</text>
    <text x="20" y="100" font-size="12" fill="#0f172a">Outside click: closes the menu and restores focus to the trigger.</text>
    <text x="20" y="120" font-size="12" fill="#0f172a">Selected item: role=menuitemcheckbox / aria-checked (when applicable).</text>
    <text x="20" y="160" font-size="11" fill="#475569">Tokens: --color-surface-elevated, --shadow-md, --radius-md, --duration-fast</text>
    <text x="20" y="178" font-size="11" fill="#475569">Dark theme: bg #1f2937, text #f1f5f9, hover bg color-mix(in oklch, surface 50%, primary-light)</text>
  </g>
</svg>
