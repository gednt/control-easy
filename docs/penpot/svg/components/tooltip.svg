<?xml version="1.0" encoding="UTF-8"?>
<!--
  ce-tooltip - hidden and visible states
  Source: design.md (ce-tooltip section) - UC-022
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" width="1280" height="240" font-family="Inter, system-ui, sans-serif">
  <title>ce-tooltip - Component Reference</title>
  <desc>Directive: button[ceTooltip]=text. Shows after 400ms hover, hides on leave. CDK Overlay positioning.</desc>

  <rect width="1280" height="240" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#0f172a">ce-tooltip (directive)</text>
  <text x="40" y="72" font-size="14" fill="#475569">usage: &lt;button ceTooltip="Open settings"&gt;  |  show after 400ms hover  |  UC-022</text>

  <!-- hidden state -->
  <g transform="translate(80,140)">
    <rect width="40" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <line x1="12" y1="20" x2="28" y2="20" stroke="#475569" stroke-width="2"/>
    <circle cx="20" cy="12" r="3" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="20" y="60" font-size="11" fill="#475569" text-anchor="middle">hidden</text>
  </g>

  <!-- visible state -->
  <g transform="translate(220,140)">
    <rect width="40" height="40" rx="8" fill="#ffffff" stroke="#4f46e5"/>
    <line x1="12" y1="20" x2="28" y2="20" stroke="#0f172a" stroke-width="2"/>
    <circle cx="20" cy="12" r="3" fill="none" stroke="#0f172a" stroke-width="2"/>

    <g transform="translate(-50,-46)">
      <rect width="140" height="32" rx="6" fill="#0f172a"/>
      <text x="70" y="20" font-size="12" fill="#ffffff" text-anchor="middle">Open settings</text>
    </g>
    <text x="20" y="60" font-size="11" fill="#475569" text-anchor="middle">visible (after 400ms)</text>
  </g>

  <g transform="translate(420,120)">
    <rect width="820" height="80" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="20" y="32" font-size="14" font-weight="600" fill="#0f172a">Accessibility &amp; behavior</text>
    <text x="20" y="56" font-size="12" fill="#0f172a">role: tooltip  |  shows on focus, hides on blur or Escape  |  disabled when prefers-reduced-motion: reduce  |  Tokens: --color-text-primary bg, --color-surface fg, --radius-md</text>
  </g>
</svg>
