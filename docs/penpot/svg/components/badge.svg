<?xml version="1.0" encoding="UTF-8"?>
<!--
  ce-badge - All tones, both sizes
  Source: design.md (ce-badge section) - UC-013
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" font-family="Inter, system-ui, sans-serif">
  <title>ce-badge - Component Reference</title>
  <desc>Tones: primary, success, warning, danger, info, neutral. Sizes: sm (h20), md (h24). Rounded-full pill.</desc>

  <rect width="1280" height="320" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#0f172a">ce-badge</text>
  <text x="40" y="72" font-size="14" fill="#475569">props: tone, size  |  UC-013</text>

  <text x="40" y="120" font-size="14" font-weight="600" fill="#0f172a">size=md  (height 24)</text>

  <g transform="translate(40,140)">
    <rect width="80" height="24" rx="12" fill="#eef2ff"/>
    <text x="40" y="16" font-size="12" font-weight="500" fill="#4f46e5" text-anchor="middle">Primary</text>
  </g>
  <g transform="translate(140,140)">
    <rect width="80" height="24" rx="12" fill="#dcfce7"/>
    <text x="40" y="16" font-size="12" font-weight="500" fill="#22c55e" text-anchor="middle">Success</text>
  </g>
  <g transform="translate(240,140)">
    <rect width="80" height="24" rx="12" fill="#fef3c7"/>
    <text x="40" y="16" font-size="12" font-weight="500" fill="#f59e0b" text-anchor="middle">Warning</text>
  </g>
  <g transform="translate(340,140)">
    <rect width="80" height="24" rx="12" fill="#fee2e2"/>
    <text x="40" y="16" font-size="12" font-weight="500" fill="#ef4444" text-anchor="middle">Danger</text>
  </g>
  <g transform="translate(440,140)">
    <rect width="80" height="24" rx="12" fill="#dbeafe"/>
    <text x="40" y="16" font-size="12" font-weight="500" fill="#3b82f6" text-anchor="middle">Info</text>
  </g>
  <g transform="translate(540,140)">
    <rect width="80" height="24" rx="12" fill="#f1f5f9"/>
    <text x="40" y="16" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">Neutral</text>
  </g>

  <text x="40" y="200" font-size="14" font-weight="600" fill="#0f172a">size=sm  (height 20)</text>

  <g transform="translate(40,220)">
    <rect width="70" height="20" rx="10" fill="#eef2ff"/>
    <text x="35" y="14" font-size="11" font-weight="500" fill="#4f46e5" text-anchor="middle">Primary</text>
  </g>
  <g transform="translate(130,220)">
    <rect width="70" height="20" rx="10" fill="#dcfce7"/>
    <text x="35" y="14" font-size="11" font-weight="500" fill="#22c55e" text-anchor="middle">Success</text>
  </g>
  <g transform="translate(220,220)">
    <rect width="70" height="20" rx="10" fill="#fef3c7"/>
    <text x="35" y="14" font-size="11" font-weight="500" fill="#f59e0b" text-anchor="middle">Warning</text>
  </g>
  <g transform="translate(310,220)">
    <rect width="70" height="20" rx="10" fill="#fee2e2"/>
    <text x="35" y="14" font-size="11" font-weight="500" fill="#ef4444" text-anchor="middle">Danger</text>
  </g>
  <g transform="translate(400,220)">
    <rect width="70" height="20" rx="10" fill="#dbeafe"/>
    <text x="35" y="14" font-size="11" font-weight="500" fill="#3b82f6" text-anchor="middle">Info</text>
  </g>
  <g transform="translate(490,220)">
    <rect width="70" height="20" rx="10" fill="#f1f5f9"/>
    <text x="35" y="14" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">Neutral</text>
  </g>

  <!-- A11y -->
  <g transform="translate(40,280)">
    <rect width="1200" height="32" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="20" y="20" font-size="12" fill="#0f172a">role: status (implicit)  |  aria-label is the visible text  |  Tokens: --color-{tone}-light bg, --color-{tone} text, --radius-full, --font-size-xs</text>
  </g>
</svg>
