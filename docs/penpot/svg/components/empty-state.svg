<?xml version="1.0" encoding="UTF-8"?>
<!--
  ce-empty-state
  Source: design.md (ce-empty-state section) - UC-017
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="Inter, system-ui, sans-serif">
  <title>ce-empty-state - Component Reference</title>
  <desc>Centered illustration + headline + description + optional CTA. Centered vertical layout.</desc>

  <rect width="1280" height="360" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#0f172a">ce-empty-state</text>
  <text x="40" y="72" font-size="14" fill="#475569">props: icon (Lucide), title, description, actionLabel  |  output: (action)  |  UC-017</text>

  <!-- with CTA -->
  <g transform="translate(40,110)">
    <rect width="560" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <g transform="translate(252,32)">
      <circle cx="28" cy="28" r="28" fill="#eef2ff"/>
      <rect x="20" y="14" width="16" height="22" rx="2" fill="none" stroke="#4f46e5" stroke-width="2"/>
      <line x1="20" y1="22" x2="36" y2="22" stroke="#4f46e5" stroke-width="2"/>
    </g>
    <text x="280" y="120" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">No visits today</text>
    <text x="280" y="142" font-size="13" fill="#475569" text-anchor="middle">Open a new visit to get started.</text>
    <g transform="translate(216,160)">
      <rect width="128" height="36" rx="8" fill="#4f46e5"/>
      <text x="64" y="22" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">+ New visit</text>
    </g>
  </g>

  <!-- without CTA -->
  <g transform="translate(640,110)">
    <rect width="560" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <g transform="translate(252,32)">
      <circle cx="28" cy="28" r="28" fill="#f1f5f9"/>
      <line x1="28" y1="14" x2="28" y2="36" stroke="#94a3b8" stroke-width="2"/>
      <line x1="14" y1="28" x2="42" y2="28" stroke="#94a3b8" stroke-width="2"/>
    </g>
    <text x="280" y="120" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">No results</text>
    <text x="280" y="142" font-size="13" fill="#475569" text-anchor="middle">Try a different search term.</text>
  </g>

  <g transform="translate(40,348)">
    <text x="0" y="0" font-size="12" fill="#475569">role: status (implicit)  |  icon: aria-hidden=true  |  CTA: regular ce-button  |  Tokens: --color-text-secondary for description</text>
  </g>
</svg>
