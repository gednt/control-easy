<?xml version="1.0" encoding="UTF-8"?>
<!--
  ce-pagination
  Source: design.md (ce-pagination section) - UC-023
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" font-family="Inter, system-ui, sans-serif">
  <title>ce-pagination - Component Reference</title>
  <desc>First/prev/next/last + page list with ellipsis. ARIA: nav aria-label=Pagination.</desc>

  <rect width="1280" height="280" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#0f172a">ce-pagination</text>
  <text x="40" y="72" font-size="14" fill="#475569">props: page, pageSize, total, pageSizeOptions  |  outputs: (pageChange), (pageSizeChange)  |  UC-023</text>

  <!-- pagination bar -->
  <g transform="translate(40,120)">
    <rect width="1200" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="26" font-size="13" fill="#475569">Rows per page:</text>
    <rect x="124" y="6" width="56" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="152" y="24" font-size="12" fill="#0f172a" text-anchor="middle">10</text>
    <text x="180" y="24" font-size="10" fill="#475569" text-anchor="middle">v</text>

    <text x="220" y="26" font-size="13" fill="#475569">1-10 of 312</text>

    <g transform="translate(800,4)">
      <rect width="32" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="22" font-size="14" fill="#475569" text-anchor="middle">|</text>
      <text x="16" y="20" font-size="14" fill="#475569" text-anchor="middle">&lt;&lt;</text>
    </g>
    <g transform="translate(836,4)">
      <rect width="32" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="22" font-size="14" fill="#475569" text-anchor="middle">&lt;</text>
    </g>
    <g transform="translate(872,4)">
      <rect width="32" height="32" rx="6" fill="#4f46e5"/>
      <text x="16" y="22" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
    </g>
    <g transform="translate(908,4)">
      <rect width="32" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="22" font-size="13" fill="#0f172a" text-anchor="middle">2</text>
    </g>
    <g transform="translate(944,4)">
      <rect width="32" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="22" font-size="13" fill="#0f172a" text-anchor="middle">3</text>
    </g>
    <text x="994" y="26" font-size="13" fill="#475569" text-anchor="middle">...</text>
    <g transform="translate(1016,4)">
      <rect width="32" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="22" font-size="13" fill="#0f172a" text-anchor="middle">32</text>
    </g>
    <g transform="translate(1052,4)">
      <rect width="32" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="22" font-size="14" fill="#475569" text-anchor="middle">&gt;</text>
    </g>
    <g transform="translate(1088,4)">
      <rect width="32" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="22" font-size="14" fill="#475569" text-anchor="middle">&gt;&gt;</text>
    </g>
  </g>

  <g transform="translate(40,200)">
    <rect width="1200" height="60" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="20" y="32" font-size="14" font-weight="600" fill="#0f172a">Accessibility &amp; behavior</text>
    <text x="20" y="52" font-size="12" fill="#0f172a">role: nav  |  aria-label=Pagination  |  active page: aria-current=page  |  edge cases: total=0 (disabled), total=1 (no controls), total=1000 (ellipsis)  |  Tokens: --radius-md, --color-primary active</text>
  </g>
</svg>
