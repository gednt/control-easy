<?xml version="1.0" encoding="UTF-8"?>
<!--
  ce-button - All variants, sizes, and states
  Source: .specs/2 - visual-design-system/design.md (ce-button section)
  Token names map 1:1 to docs/penpot/tokens.json
  Colors inlined as the resolved light-theme hex (from tokens.json light block) so designers
  can read this SVG without a CSS engine. Every fill/stroke is annotated with the token it came from.
  A11y: focus-ring is rendered as a dashed indigo ring (matches :focus-visible).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="Inter, system-ui, sans-serif">
  <title>ce-button - Component Reference</title>
  <desc>Variants: primary, secondary, ghost, danger. Sizes: sm (32), md (40), lg (48). States: default, hover, focus, active, disabled, loading. A11y: focus ring is dashed indigo; aria-busy and aria-disabled shown as annotations.</desc>

  <rect width="1280" height="900" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#0f172a">ce-button</text>
  <text x="40" y="72" font-size="14" fill="#475569">selector: ce-button  |  props: variant, size, loading, disabled, type  |  UC-009</text>

  <!-- Section: Sizes reference (md) -->
  <text x="40" y="120" font-size="14" font-weight="600" fill="#0f172a">Variant: primary  -  Size: medium  (height 40, padding 16, font 14)</text>

  <!-- default -->
  <g transform="translate(40,140)">
    <rect width="120" height="40" rx="12" fill="#4f46e5"/>
    <text x="60" y="25" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Save</text>
    <text x="60" y="68" font-size="11" fill="#475569" text-anchor="middle">default</text>
  </g>

  <!-- hover -->
  <g transform="translate(180,140)">
    <rect x="0" y="-1" width="120" height="40" rx="12" fill="#4f46e5"/>
    <text x="60" y="24" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Save</text>
    <text x="60" y="68" font-size="11" fill="#475569" text-anchor="middle">hover (translateY -1px + glow)</text>
  </g>

  <!-- focus -->
  <g transform="translate(320,140)">
    <rect x="-4" y="-4" width="128" height="48" rx="14" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="4 2"/>
    <rect width="120" height="40" rx="12" fill="#4f46e5"/>
    <text x="60" y="25" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Save</text>
    <text x="60" y="68" font-size="11" fill="#475569" text-anchor="middle">focus (2px ring, offset 2px)</text>
  </g>

  <!-- active -->
  <g transform="translate(460,140)">
    <rect width="120" height="40" rx="12" fill="#4338ca"/>
    <text x="60" y="25" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Save</text>
    <text x="60" y="68" font-size="11" fill="#475569" text-anchor="middle">active (--color-primary-hover)</text>
  </g>

  <!-- disabled -->
  <g transform="translate(600,140)">
    <rect width="120" height="40" rx="12" fill="#4f46e5" opacity="0.6"/>
    <text x="60" y="25" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Save</text>
    <text x="60" y="68" font-size="11" fill="#475569" text-anchor="middle">disabled (aria-disabled)</text>
  </g>

  <!-- loading -->
  <g transform="translate(740,140)">
    <rect width="120" height="40" rx="12" fill="#4f46e5"/>
    <circle cx="44" cy="20" r="6" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="74" y="25" font-size="14" font-weight="500" fill="#ffffff">Saving</text>
    <text x="60" y="68" font-size="11" fill="#475569" text-anchor="middle">loading (aria-busy)</text>
  </g>

  <!-- Section: Variants row -->
  <text x="40" y="260" font-size="14" font-weight="600" fill="#0f172a">Variants (size md)</text>

  <g transform="translate(40,280)">
    <rect width="120" height="40" rx="12" fill="#4f46e5"/>
    <text x="60" y="25" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Primary</text>
    <text x="60" y="60" font-size="11" fill="#475569" text-anchor="middle">variant=primary</text>
  </g>
  <g transform="translate(180,280)">
    <rect width="120" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="60" y="25" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Secondary</text>
    <text x="60" y="60" font-size="11" fill="#475569" text-anchor="middle">variant=secondary</text>
  </g>
  <g transform="translate(320,280)">
    <rect width="120" height="40" rx="12" fill="transparent"/>
    <text x="60" y="25" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Ghost</text>
    <text x="60" y="60" font-size="11" fill="#475569" text-anchor="middle">variant=ghost</text>
  </g>
  <g transform="translate(460,280)">
    <rect width="120" height="40" rx="12" fill="#ef4444"/>
    <text x="60" y="25" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Danger</text>
    <text x="60" y="60" font-size="11" fill="#475569" text-anchor="middle">variant=danger</text>
  </g>

  <!-- Section: Sizes -->
  <text x="40" y="400" font-size="14" font-weight="600" fill="#0f172a">Sizes (variant primary)</text>

  <g transform="translate(40,420)">
    <rect width="100" height="32" rx="12" fill="#4f46e5"/>
    <text x="50" y="21" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">Small</text>
    <text x="50" y="52" font-size="11" fill="#475569" text-anchor="middle">size=sm  (h32, p12, fs12)</text>
  </g>
  <g transform="translate(160,420)">
    <rect width="120" height="40" rx="12" fill="#4f46e5"/>
    <text x="60" y="26" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Medium</text>
    <text x="60" y="60" font-size="11" fill="#475569" text-anchor="middle">size=md  (h40, p16, fs14)</text>
  </g>
  <g transform="translate(300,420)">
    <rect width="140" height="48" rx="12" fill="#4f46e5"/>
    <text x="70" y="31" font-size="16" font-weight="500" fill="#ffffff" text-anchor="middle">Large</text>
    <text x="70" y="68" font-size="11" fill="#475569" text-anchor="middle">size=lg  (h48, p24, fs16)</text>
  </g>

  <!-- A11y annotation block -->
  <g transform="translate(40,540)">
    <rect width="1200" height="120" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#0f172a">Accessibility (a11y)</text>
    <text x="20" y="52" font-size="13" fill="#0f172a">role: button (native)  |  aria-disabled: true when disabled  |  aria-busy: true when loading</text>
    <text x="20" y="72" font-size="13" fill="#0f172a">Keyboard: Space and Enter activate. Focus ring: 2px solid var(--color-primary), offset 2px.</text>
    <text x="20" y="92" font-size="13" fill="#0f172a">Touch target: rendered height is the size prop; minimum 44x44px required on viewports &lt;640px (use size=lg).</text>
    <text x="20" y="110" font-size="11" fill="#475569">Tokens: --color-primary, --color-primary-hover, --color-danger, --color-border, --color-surface, --radius-lg, --shadow-sm, --shadow-primary-glow, --duration-fast</text>
  </g>

  <!-- Dark theme row -->
  <g transform="translate(40,700)">
    <rect width="1200" height="160" rx="12" fill="#0b1020"/>
    <text x="20" y="32" font-size="14" font-weight="600" fill="#f1f5f9">Dark theme (data-theme=dark)</text>

    <g transform="translate(20,50)">
      <rect width="120" height="40" rx="12" fill="#818cf8"/>
      <text x="60" y="25" font-size="14" font-weight="500" fill="#0b1020" text-anchor="middle">Primary</text>
    </g>
    <g transform="translate(160,50)">
      <rect width="120" height="40" rx="12" fill="#111827" stroke="#1f2937"/>
      <text x="60" y="25" font-size="14" font-weight="500" fill="#f1f5f9" text-anchor="middle">Secondary</text>
    </g>
    <g transform="translate(300,50)">
      <rect width="120" height="40" rx="12" fill="transparent"/>
      <text x="60" y="25" font-size="14" font-weight="500" fill="#f1f5f9" text-anchor="middle">Ghost</text>
    </g>
    <g transform="translate(440,50)">
      <rect width="120" height="40" rx="12" fill="#f87171"/>
      <text x="60" y="25" font-size="14" font-weight="500" fill="#0b1020" text-anchor="middle">Danger</text>
    </g>

    <g transform="translate(580,50)">
      <rect x="-4" y="-4" width="128" height="48" rx="14" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 2"/>
      <rect width="120" height="40" rx="12" fill="#818cf8"/>
      <text x="60" y="25" font-size="14" font-weight="500" fill="#0b1020" text-anchor="middle">Focused</text>
    </g>

    <text x="20" y="130" font-size="11" fill="#94a3b8">Dark tokens: --color-primary #818cf8, --color-surface #111827, --color-text-primary #f1f5f9, --color-border #1f2937, --color-danger #f87171</text>
  </g>
</svg>
