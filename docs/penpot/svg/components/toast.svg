<?xml version="1.0" encoding="UTF-8"?>
<!--
  ce-toast - All four tones, stacked bottom-right
  Source: design.md (ce-toast section) - UC-015
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" font-family="Inter, system-ui, sans-serif">
  <title>ce-toast - Component Reference</title>
  <desc>Non-blocking notification stack. Stacks bottom-right. Tones: success, info, warning, danger. Auto-dismiss after duration (default 5000ms).</desc>

  <rect width="1280" height="480" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#0f172a">ce-toast (host component)</text>
  <text x="40" y="72" font-size="14" fill="#475569">service: ToastService.success / info / warning / error  |  UC-015</text>

  <text x="40" y="120" font-size="14" font-weight="600" fill="#0f172a">Stacked (bottom-right of viewport)</text>

  <!-- danger -->
  <g transform="translate(40,140)">
    <rect width="340" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="4" height="64" fill="#ef4444"/>
    <text x="20" y="28" font-size="13" font-weight="600" fill="#0f172a">Failed to save</text>
    <text x="20" y="48" font-size="12" fill="#475569">Resident not updated. Try again.</text>
    <text x="320" y="20" font-size="14" fill="#94a3b8" text-anchor="end">x</text>
  </g>

  <!-- warning -->
  <g transform="translate(40,220)">
    <rect width="340" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="4" height="64" fill="#f59e0b"/>
    <text x="20" y="28" font-size="13" font-weight="600" fill="#0f172a">Vehicle insurance expiring</text>
    <text x="20" y="48" font-size="12" fill="#475569">ABC-1D23 in 7 days.</text>
    <text x="320" y="20" font-size="14" fill="#94a3b8" text-anchor="end">x</text>
  </g>

  <!-- success -->
  <g transform="translate(40,300)">
    <rect width="340" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="4" height="64" fill="#22c55e"/>
    <text x="20" y="28" font-size="13" font-weight="600" fill="#0f172a">Resident saved</text>
    <text x="20" y="48" font-size="12" fill="#475569">Maria Silva was updated.</text>
    <text x="320" y="20" font-size="14" fill="#94a3b8" text-anchor="end">x</text>
  </g>

  <!-- info -->
  <g transform="translate(40,380)">
    <rect width="340" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="4" height="64" fill="#3b82f6"/>
    <text x="20" y="28" font-size="13" font-weight="600" fill="#0f172a">Sync in progress</text>
    <text x="20" y="48" font-size="12" fill="#475569">Downloading 142 residents...</text>
    <text x="320" y="20" font-size="14" fill="#94a3b8" text-anchor="end">x</text>
  </g>

  <g transform="translate(440,140)">
    <rect width="780" height="320" rx="16" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="20" y="36" font-size="16" font-weight="600" fill="#0f172a">Toast service API</text>

    <text x="20" y="76" font-size="12" font-weight="600" fill="#0f172a">Usage:</text>
    <text x="20" y="100" font-size="12" font-family="ui-monospace, SFMono-Regular, monospace" fill="#0f172a">toast.success('Resident saved');</text>
    <text x="20" y="120" font-size="12" font-family="ui-monospace, SFMono-Regular, monospace" fill="#0f172a">toast.error('Failed to save', { duration: 8000 });</text>
    <text x="20" y="140" font-size="12" font-family="ui-monospace, SFMono-Regular, monospace" fill="#0f172a">toast.info('Sync in progress...', { duration: 0 }); // sticky</text>

    <text x="20" y="180" font-size="12" font-weight="600" fill="#0f172a">Accessibility (a11y)</text>
    <text x="20" y="204" font-size="12" fill="#0f172a">Container: role=region, aria-live=polite, aria-label=Notifications</text>
    <text x="20" y="224" font-size="12" fill="#0f172a">Each toast: dismissible by click; Escape closes topmost.</text>
    <text x="20" y="244" font-size="12" fill="#0f172a">Auto-dismiss: opts.duration ?? 5000ms. Sticky when duration=0.</text>
    <text x="20" y="264" font-size="12" fill="#0f172a">prefers-reduced-motion: reduce - toast-in / toast-out collapse to 0ms.</text>

    <text x="20" y="296" font-size="11" fill="#475569">Tokens: --radius-lg, --shadow-md, --color-{tone} (left border), --duration-base (animation), toast-in / toast-out keyframes</text>
  </g>
</svg>
