<?xml version="1.0" encoding="UTF-8"?>
<!--
  Layout shell - Sidebar + Topbar + main grid
  Three breakpoints: mobile (<640, drawer), tablet (640-1024, rail), desktop (>=1024, expanded)
  Source: .specs/2 - visual-design-system/design.md (Layout shell section)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1400" width="1920" height="1400" font-family="Inter, system-ui, sans-serif">
  <title>Layout Shell - Three Responsive Breakpoints</title>
  <desc>Top: desktop sidebar 256px + topbar + grid. Middle: tablet icon rail 64px. Bottom: mobile drawer 256px slide-in. Each annotated with breakpoint and a11y notes.</desc>

  <rect width="1920" height="1400" fill="#f8fafc"/>

  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">AppShell - Layout</text>
  <text x="40" y="76" font-size="14" fill="#475569">Sidebar + Topbar + main content. Mobile-first. Token names match docs/penpot/tokens.json.</text>

  <!-- ============ DESKTOP (>= 1024px) ============ -->
  <g transform="translate(40,120)">
    <text x="0" y="0" font-size="18" font-weight="600" fill="#0f172a">Desktop (viewport &gt;= 1024px)</text>
    <text x="0" y="22" font-size="12" fill="#475569">Sidebar w-64 (256px), topbar h-16, grid grid-cols-[16rem_1fr], main overflow-y-auto</text>

    <g transform="translate(0,40)">
      <!-- sidebar expanded -->
      <rect width="256" height="440" fill="#0f172a"/>
      <text x="20" y="32" font-size="14" font-weight="700" fill="#cbd5e1">ControlEasy</text>
      <text x="20" y="48" font-size="10" fill="#94a3b8">Condominium access</text>

      <text x="20" y="84" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.06em">NAVIGATION</text>
      <!-- active item -->
      <rect x="12" y="96" width="232" height="36" rx="8" fill="#4f46e5"/>
      <text x="32" y="120" font-size="13" font-weight="500" fill="#ffffff">Dashboard</text>

      <text x="32" y="156" font-size="13" fill="#cbd5e1">Residents</text>
      <text x="32" y="188" font-size="13" fill="#cbd5e1">Visits</text>
      <text x="32" y="220" font-size="13" fill="#cbd5e1">Vehicles</text>
      <text x="32" y="252" font-size="13" fill="#cbd5e1">Service providers</text>
      <text x="32" y="284" font-size="13" fill="#cbd5e1">Administration</text>
      <text x="32" y="316" font-size="13" fill="#cbd5e1">Settings</text>

      <!-- user footer -->
      <line x1="12" y1="356" x2="244" y2="356" stroke="#1f2937"/>
      <circle cx="36" cy="394" r="16" fill="#4f46e5"/>
      <text x="36" y="398" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">AT</text>
      <text x="60" y="390" font-size="12" font-weight="500" fill="#cbd5e1">Andre (Attendant)</text>
      <text x="60" y="406" font-size="10" fill="#94a3b8">Day shift, Gate A</text>

      <text x="128" y="220" font-size="10" fill="#64748b" text-anchor="middle">w-64</text>
      <text x="128" y="235" font-size="10" fill="#64748b" text-anchor="middle">--sidebar-bg</text>

      <!-- topbar -->
      <rect x="256" width="920" height="64" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="280" y="38" font-size="12" fill="#475569">Dashboard / Residents / Maria Silva</text>
      <rect x="800" y="16" width="180" height="32" rx="8" fill="#f1f5f9"/>
      <text x="816" y="36" font-size="12" fill="#94a3b8">Search...</text>
      <circle cx="1040" cy="32" r="14" fill="#eef2ff"/>
      <text x="1040" y="36" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">v</text>
      <circle cx="1080" cy="32" r="14" fill="#4f46e5"/>
      <text x="1080" y="36" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">AT</text>
      <text x="920" y="84" font-size="10" fill="#64748b" text-anchor="middle">h-16 sticky top-0 z-50</text>

      <!-- main area -->
      <rect x="256" y="64" width="920" height="376" fill="#f8fafc"/>
      <text x="280" y="100" font-size="20" font-weight="600" fill="#0f172a">Welcome, Andre</text>
      <text x="280" y="120" font-size="13" fill="#475569">42 visits today across 3 gatehouses</text>

      <!-- stat tiles -->
      <g transform="translate(280,140)">
        <rect width="200" height="100" rx="16" fill="#ffffff"/>
        <text x="16" y="28" font-size="11" font-weight="500" fill="#475569">VISITS TODAY</text>
        <text x="16" y="64" font-size="24" font-weight="700" fill="#0f172a">42</text>
        <rect x="16" y="74" width="56" height="18" rx="9" fill="#dcfce7"/>
        <text x="44" y="87" font-size="10" font-weight="500" fill="#22c55e" text-anchor="middle">+12%</text>
      </g>
      <g transform="translate(500,140)">
        <rect width="200" height="100" rx="16" fill="#ffffff"/>
        <text x="16" y="28" font-size="11" font-weight="500" fill="#475569">EXPECTED</text>
        <text x="16" y="64" font-size="24" font-weight="700" fill="#0f172a">17</text>
        <text x="16" y="86" font-size="11" fill="#475569">pre-registered</text>
      </g>
      <g transform="translate(720,140)">
        <rect width="200" height="100" rx="16" fill="#ffffff"/>
        <text x="16" y="28" font-size="11" font-weight="500" fill="#475569">DENIED</text>
        <text x="16" y="64" font-size="24" font-weight="700" fill="#0f172a">3</text>
        <rect x="16" y="74" width="56" height="18" rx="9" fill="#fee2e2"/>
        <text x="44" y="87" font-size="10" font-weight="500" fill="#ef4444" text-anchor="middle">-1</text>
      </g>
      <g transform="translate(940,140)">
        <rect width="216" height="100" rx="16" fill="#ffffff"/>
        <text x="16" y="28" font-size="11" font-weight="500" fill="#475569">ON-SHIFT</text>
        <text x="16" y="64" font-size="24" font-weight="700" fill="#0f172a">5</text>
        <text x="16" y="86" font-size="11" fill="#475569">attendants</text>
      </g>

      <!-- recent activity card -->
      <g transform="translate(280,260)">
        <rect width="876" height="160" rx="16" fill="#ffffff"/>
        <text x="20" y="32" font-size="14" font-weight="600" fill="#0f172a">Recent visits</text>
        <line x1="20" y1="44" x2="856" y2="44" stroke="#e2e8f0"/>
        <text x="20" y="68" font-size="12" fill="#0f172a">14:32  Carlos Souza  -&gt;  102-A (Maria)</text>
        <text x="20" y="92" font-size="12" fill="#0f172a">14:18  Delivery: Mercado Central  -&gt;  501</text>
        <text x="20" y="116" font-size="12" fill="#0f172a">14:02  Plumber Joao  -&gt;  204-C</text>
        <text x="20" y="140" font-size="12" fill="#0f172a">13:50  Uber Eats (Maria)  -&gt;  102-A</text>
      </g>

      <!-- a11y annotation -->
      <g transform="translate(0,460)">
        <text x="0" y="0" font-size="11" fill="#475569">a11y: skip-to-content link is first focusable element, jumps to &lt;main id=main tabindex=-1&gt;  |  active route: --sidebar-active-bg + --sidebar-active-text  |  focus ring: 2px primary outline, offset 2px</text>
      </g>
    </g>
  </g>

  <!-- ============ TABLET (640-1024px) ============ -->
  <g transform="translate(40,700)">
    <text x="0" y="0" font-size="18" font-weight="600" fill="#0f172a">Tablet (640-1024px)</text>
    <text x="0" y="22" font-size="12" fill="#475569">Sidebar w-16 (64px icon rail), topbar stays h-16, table density relaxes</text>

    <g transform="translate(0,40)">
      <!-- sidebar icon rail -->
      <rect width="64" height="360" fill="#0f172a"/>
      <text x="32" y="36" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="middle">CE</text>

      <!-- active route icon -->
      <rect x="8" y="56" width="48" height="40" rx="8" fill="#4f46e5"/>
      <text x="32" y="82" font-size="14" fill="#ffffff" text-anchor="middle">#</text>

      <text x="32" y="124" font-size="14" fill="#cbd5e1" text-anchor="middle">R</text>
      <text x="32" y="160" font-size="14" fill="#cbd5e1" text-anchor="middle">V</text>
      <text x="32" y="196" font-size="14" fill="#cbd5e1" text-anchor="middle">C</text>
      <text x="32" y="232" font-size="14" fill="#cbd5e1" text-anchor="middle">S</text>
      <text x="32" y="268" font-size="14" fill="#cbd5e1" text-anchor="middle">A</text>
      <text x="32" y="304" font-size="14" fill="#cbd5e1" text-anchor="middle">X</text>

      <text x="32" y="200" font-size="10" fill="#64748b" text-anchor="middle">w-16</text>

      <!-- topbar -->
      <rect x="64" width="600" height="64" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="84" y="38" font-size="12" fill="#475569">Dashboard / Maria Silva</text>
      <rect x="500" y="16" width="120" height="32" rx="8" fill="#f1f5f9"/>
      <text x="516" y="36" font-size="11" fill="#94a3b8">Search</text>
      <circle cx="640" cy="32" r="14" fill="#4f46e5"/>
      <text x="640" y="36" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">AT</text>

      <!-- main -->
      <rect x="64" y="64" width="600" height="296" fill="#f8fafc"/>
      <text x="84" y="100" font-size="20" font-weight="600" fill="#0f172a">Welcome, Andre</text>

      <g transform="translate(84,120)">
        <rect width="180" height="80" rx="12" fill="#ffffff"/>
        <text x="14" y="24" font-size="11" font-weight="500" fill="#475569">VISITS</text>
        <text x="14" y="58" font-size="22" font-weight="700" fill="#0f172a">42</text>
      </g>
      <g transform="translate(280,120)">
        <rect width="180" height="80" rx="12" fill="#ffffff"/>
        <text x="14" y="24" font-size="11" font-weight="500" fill="#475569">EXPECTED</text>
        <text x="14" y="58" font-size="22" font-weight="700" fill="#0f172a">17</text>
      </g>
      <g transform="translate(476,120)">
        <rect width="180" height="80" rx="12" fill="#ffffff"/>
        <text x="14" y="24" font-size="11" font-weight="500" fill="#475569">DENIED</text>
        <text x="14" y="58" font-size="22" font-weight="700" fill="#0f172a">3</text>
      </g>

      <!-- a11y -->
      <g transform="translate(0,380)">
        <text x="0" y="0" font-size="11" fill="#475569">a11y: tooltips on icon-only items (ce-tooltip), keyboard: tab to enter rail, Enter to activate, ArrowDown to enter submenu if any</text>
      </g>
    </g>
  </g>

  <!-- ============ MOBILE (< 640px) ============ -->
  <g transform="translate(40,1180)">
    <text x="0" y="0" font-size="18" font-weight="600" fill="#0f172a">Mobile (&lt; 640px)</text>
    <text x="0" y="22" font-size="12" fill="#475569">Sidebar becomes slide-in drawer (slide-in keyframe), topbar condenses, table becomes stacked card list</text>

    <g transform="translate(0,40)">
      <!-- backdrop (drawer open) -->
      <rect width="600" height="360" fill="#0b1020" opacity="0.4"/>

      <!-- drawer -->
      <g transform="translate(0,0)">
        <rect width="256" height="360" fill="#0f172a"/>
        <text x="20" y="36" font-size="14" font-weight="700" fill="#cbd5e1">ControlEasy</text>
        <line x1="12" y1="56" x2="244" y2="56" stroke="#1f2937"/>
        <rect x="12" y="68" width="232" height="36" rx="8" fill="#4f46e5"/>
        <text x="32" y="92" font-size="13" font-weight="500" fill="#ffffff">Dashboard</text>
        <text x="32" y="128" font-size="13" fill="#cbd5e1">Residents</text>
        <text x="32" y="160" font-size="13" fill="#cbd5e1">Visits</text>
        <text x="32" y="192" font-size="13" fill="#cbd5e1">Vehicles</text>
        <text x="32" y="224" font-size="13" fill="#cbd5e1">Service providers</text>
        <text x="32" y="256" font-size="13" fill="#cbd5e1">Administration</text>
        <text x="32" y="288" font-size="13" fill="#cbd5e1">Settings</text>
        <text x="128" y="160" font-size="10" fill="#64748b" text-anchor="middle">drawer 256px</text>
        <text x="128" y="174" font-size="10" fill="#64748b" text-anchor="middle">slide-in keyframe</text>
        <text x="128" y="188" font-size="10" fill="#64748b" text-anchor="middle">--duration-slow</text>
      </g>

      <!-- topbar -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="600" height="64" fill="#ffffff" stroke="#e2e8f0"/>
        <rect x="20" y="16" width="32" height="32" rx="6" fill="#f1f5f9"/>
        <text x="36" y="36" font-size="14" fill="#0f172a" text-anchor="middle">=</text>
        <text x="64" y="38" font-size="13" font-weight="600" fill="#0f172a">Dashboard</text>
        <circle cx="568" cy="32" r="14" fill="#4f46e5"/>
        <text x="568" y="36" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">AT</text>
      </g>

      <!-- main peeking from behind drawer -->
      <rect x="256" y="64" width="344" height="296" fill="#f8fafc"/>
      <text x="276" y="100" font-size="16" font-weight="600" fill="#0f172a">Welcome, Andre</text>

      <g transform="translate(276,120)">
        <rect width="304" height="64" rx="12" fill="#ffffff"/>
        <text x="14" y="24" font-size="11" font-weight="500" fill="#475569">VISITS TODAY</text>
        <text x="14" y="54" font-size="20" font-weight="700" fill="#0f172a">42</text>
      </g>
      <g transform="translate(276,196)">
        <rect width="304" height="64" rx="12" fill="#ffffff"/>
        <text x="14" y="24" font-size="11" font-weight="500" fill="#475569">EXPECTED</text>
        <text x="14" y="54" font-size="20" font-weight="700" fill="#0f172a">17</text>
      </g>
      <g transform="translate(276,272)">
        <rect width="304" height="64" rx="12" fill="#ffffff"/>
        <text x="14" y="24" font-size="11" font-weight="500" fill="#475569">DENIED</text>
        <text x="14" y="54" font-size="20" font-weight="700" fill="#0f172a">3</text>
      </g>

      <!-- a11y -->
      <g transform="translate(0,380)">
        <text x="0" y="0" font-size="11" fill="#475569">a11y: drawer role=dialog, aria-modal=true, cdkTrapFocus, Escape closes, backdrop click closes, focus restored to menu button  |  touch targets &gt;= 44x44  |  h-16 topbar with menu button left, avatar right</text>
      </g>
    </g>
  </g>
</svg>
