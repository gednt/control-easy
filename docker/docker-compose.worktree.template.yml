# docker/docker-compose.worktree.template.yml
#
# Template for the per-worktree Compose override. Copied to
# docker/docker-compose.worktree.<slug>.yml by scripts/worktree-up.sh
# with the placeholders below substituted via envsubst.
#
# Placeholders (substituted by scripts/worktree-up.sh):
#   ${COMPOSE_PROJECT_NAME}  e.g. ce-feat-dashboard-live-stats
#   ${TRAEFIK_HOST}          e.g. ce-feat-dashboard-live-stats.localhost
#   ${TRAEFIK_PORT}          e.g. 18090
#   ${MYSQL_VOLUME_NAME}     e.g. ce-feat-dashboard-live-stats-mysql-data
#
# The generated file is .gitignore'd (see .gitignore § "Devcontainer / Worktree").
#
# This override:
#   - Republishes the Traefik HTTP port on the host to ${TRAEFIK_PORT}.
#   - Republishes HTTPS on ${TRAEFIK_PORT}+1 and points the websecure
#     entrypoint at it so HTTP→HTTPS redirect Location headers resolve.
#   - Rewrites the Traefik router Host() rules to ${TRAEFIK_HOST}.
#   - Renames the MySQL volume to ${MYSQL_VOLUME_NAME} for isolation.
#   - Adds the worktree project name as a container label for debugging.

services:
  reverse-proxy:
    # NOTE: a `command:` override REPLACES the base compose command, so the
    # full flag set from docker/docker-compose.yml is repeated here with the
    # worktree-specific websecure port substituted in.
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Worktrees allocate ${TRAEFIK_PORT}+1 for HTTPS to avoid collisions
      # between stacks; redirect Location headers then point at it.
      - --entrypoints.websecure.address=:${TRAEFIK_HTTPS_PORT}
      # Required in Traefik v3: without entrypoint-level TLS the HTTP router
      # layer on websecure stays disabled and every request 404s.
      - --entrypoints.websecure.http.tls=true
      - --api.insecure=true
    ports: !override
      # Override the host ports to the worktree's allocated ports.
      # HTTP on ${TRAEFIK_PORT} (redirects to HTTPS), HTTPS on +1.
      - "${TRAEFIK_PORT}:80"
      - "${TRAEFIK_HTTPS_PORT}:${TRAEFIK_HTTPS_PORT}"
    labels:
      - "ce.worktree.project=${COMPOSE_PROJECT_NAME}"
      - "ce.worktree.host=${TRAEFIK_HOST}"
      - "ce.worktree.port=${TRAEFIK_PORT}"

  api:
    ports: !override []
    environment:
      # Use the per-worktree JWT signing key from the env file.
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    labels:
      - "traefik.http.routers.api.rule=Host(`${TRAEFIK_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "ce.worktree.project=${COMPOSE_PROJECT_NAME}"
      - "ce.worktree.host=${TRAEFIK_HOST}"
      - "ce.worktree.port=${TRAEFIK_PORT}"

  web:
    labels:
      - "traefik.http.routers.web.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "ce.worktree.project=${COMPOSE_PROJECT_NAME}"
      - "ce.worktree.host=${TRAEFIK_HOST}"
      - "ce.worktree.port=${TRAEFIK_PORT}"

  db:
    volumes:
      # Override the volume name to the worktree's own MySQL volume.
      - ${MYSQL_VOLUME_NAME}:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    labels:
      - "ce.worktree.project=${COMPOSE_PROJECT_NAME}"
      - "ce.worktree.host=${TRAEFIK_HOST}"
      - "ce.worktree.port=${TRAEFIK_PORT}"

  adminer:
    labels:
      - "traefik.http.routers.adminer.rule=Host(`${TRAEFIK_HOST}`) && PathPrefix(`/db`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls=true"
      - "ce.worktree.project=${COMPOSE_PROJECT_NAME}"

volumes:
  # Declare the worktree's own MySQL volume (Compose creates it under the
  # project's namespace). The name here is the EXTERNAL name; we use
  # external: true so the volume is created by the project, not by Compose.
  ${MYSQL_VOLUME_NAME}:
    external: false
    name: ${MYSQL_VOLUME_NAME}