tls:
  certificates:
    - certFile: /etc/traefik/certs/local.crt
      keyFile: /etc/traefik/certs/local.key
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/local.crt
        keyFile: /etc/traefik/certs/local.key

http:
  routers:
    api:
      rule: "(Host(`localhost`) || Host(`127.0.0.1`) || Host(`reverse-proxy`) || HostRegexp(`^[a-z0-9-]+\\.localhost$`)) && PathPrefix(`/api`)"
      entryPoints:
        - websecure
      service: api
      priority: 100

    web:
      rule: "Host(`localhost`) || Host(`127.0.0.1`) || Host(`reverse-proxy`) || HostRegexp(`^[a-z0-9-]+\\.localhost$`)"
      entryPoints:
        - websecure
      service: web
      priority: 1

    adminer:
      rule: "(Host(`localhost`) || Host(`127.0.0.1`) || HostRegexp(`^[a-z0-9-]+\\.localhost$`)) && PathPrefix(`/db`)"
      entryPoints:
        - websecure
      service: adminer
      priority: 50

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:8080"

    web:
      loadBalancer:
        servers:
          - url: "http://web:8080"

    adminer:
      loadBalancer:
        servers:
          - url: "http://adminer:8080"
