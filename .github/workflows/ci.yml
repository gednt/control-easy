name: ci

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true
  WEB_DIR: src/Web/ControlEasyReborn.Web
  COMPOSE_PROJECT_NAME: ce-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: dotnet restore src/ControlEasyReborn.sln
      - run: dotnet format src/ControlEasyReborn.sln --verify-no-changes --no-restore
      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.WEB_DIR }}
      - run: npm run lint
        working-directory: ${{ env.WEB_DIR }}
      - name: Setup Headless Chrome
        run: |
          npx playwright install --with-deps chromium
          CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "Set CHROME_BIN to $CHROME_PATH"
        working-directory: ${{ env.WEB_DIR }}
      - run: npm test -- --no-watch --browsers=ChromeHeadlessNoSandbox
        working-directory: ${{ env.WEB_DIR }}

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          #- os: windows-latest
          #  runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: dotnet build src/ControlEasyReborn.sln
      - name: tokens-contract
        run: dotnet test tests/ControlEasyReborn.ArchitectureTests --filter TokensContract
      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.WEB_DIR }}
      - run: npm run ng -- build --configuration production
        working-directory: ${{ env.WEB_DIR }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test src/ControlEasyReborn.sln

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clean dangling containers
        run: docker compose -f docker/docker-compose.yml down -v --remove-orphans || true
      - name: Build images
        run: docker compose -f docker/docker-compose.yml build db api
        env:
          API_PORT: 0
      - name: Start services with dynamic ports
        run: docker compose -f docker/docker-compose.yml up -d db api
        env:
          API_PORT: 0
      - name: Wait for API to be ready
        run: |
          RUNNER_CONTAINER_ID=""
          if [[ -n "${HOSTNAME:-}" ]]; then
            if docker inspect "$HOSTNAME" >/dev/null 2>&1; then
              RUNNER_CONTAINER_ID="$HOSTNAME"
            else
              while IFS= read -r container_id; do
                if [[ "$(docker inspect --format '{{.Config.Hostname}}' "$container_id" 2>/dev/null)" == "$HOSTNAME" ]]; then
                  RUNNER_CONTAINER_ID="$container_id"
                  break
                fi
              done < <(docker ps -q)
            fi
          fi
          if [[ -n "$RUNNER_CONTAINER_ID" ]]; then
            COMPOSE_NETWORK="${COMPOSE_PROJECT_NAME}_default"
            docker network connect "$COMPOSE_NETWORK" "$RUNNER_CONTAINER_ID" 2>/dev/null || true
            echo "CI_RUNNER_CONTAINER_ID=$RUNNER_CONTAINER_ID" >> "$GITHUB_ENV"
            echo "CI_COMPOSE_NETWORK=$COMPOSE_NETWORK" >> "$GITHUB_ENV"
            if ! docker inspect --format '{{json .NetworkSettings.Networks}}' "$RUNNER_CONTAINER_ID" | grep -Fq "\"$COMPOSE_NETWORK\""; then
              echo "Could not attach runner container $RUNNER_CONTAINER_ID to $COMPOSE_NETWORK"
              docker compose -f docker/docker-compose.yml logs api
              exit 1
            fi
            API_BASE_URL="http://api:8080"
            echo "Containerized runner attached to $COMPOSE_NETWORK"
          else
            ACTUAL_API_PORT=$(docker compose -f docker/docker-compose.yml port api 8080 | head -n 1 | sed 's/.*://' || true)
            if [[ ! "$ACTUAL_API_PORT" =~ ^[0-9]+$ ]]; then
              echo "API does not have a published port"
              docker compose -f docker/docker-compose.yml logs api
              exit 1
            fi
            API_BASE_URL="http://127.0.0.1:$ACTUAL_API_PORT"
            echo "Host runner using published API port $ACTUAL_API_PORT"
          fi
          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"
          echo "API is running at $API_BASE_URL"
          deadline=$((SECONDS + 180))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            STATUS=$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w "%{http_code}" "$API_BASE_URL/health" || true)
            echo "Attempt $attempt: HTTP $STATUS"
            if [[ "$STATUS" == "200" || "$STATUS" == "503" ]]; then exit 0; fi
            sleep 2
          done
          docker compose -f docker/docker-compose.yml logs api
          exit 1
      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.WEB_DIR }}
      - name: Run OpenAPI Check
        run: |
          npx ng-openapi-gen --input "$API_BASE_URL/swagger/v1/swagger.json" --config ng-openapi-gen.json
          git diff --exit-code -- src/app/api
        working-directory: ${{ env.WEB_DIR }}
      - name: Cleanup Containers
        if: always()
        run: |
          RUNNER_CONTAINER_ID="${CI_RUNNER_CONTAINER_ID:-${HOSTNAME:-}}"
          COMPOSE_NETWORK="${CI_COMPOSE_NETWORK:-${COMPOSE_PROJECT_NAME}_default}"
          if [[ -n "$RUNNER_CONTAINER_ID" ]] && docker inspect "$RUNNER_CONTAINER_ID" >/dev/null 2>&1; then
            docker network disconnect "$COMPOSE_NETWORK" "$RUNNER_CONTAINER_ID" 2>/dev/null || true
          fi
          docker compose -f docker/docker-compose.yml down -v --remove-orphans || true

  docker:
    needs: [build, test, openapi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/controleasy-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/controleasy-web:${{ github.sha }}