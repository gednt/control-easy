name: ci

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true
  WEB_DIR: src/Web/ControlEasyReborn.Web
  COMPOSE_PROJECT_NAME: ce-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: dotnet restore src/ControlEasyReborn.sln
      - run: dotnet format src/ControlEasyReborn.sln --verify-no-changes --no-restore
      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.WEB_DIR }}
      - run: npm run lint
        working-directory: ${{ env.WEB_DIR }}
      - name: Setup Headless Chrome
        run: |
          npx playwright install --with-deps chromium
          CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "Set CHROME_BIN to $CHROME_PATH"
        working-directory: ${{ env.WEB_DIR }}
      - run: npm test -- --no-watch --browsers=ChromeHeadlessNoSandbox
        working-directory: ${{ env.WEB_DIR }}

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: dotnet build src/ControlEasyReborn.sln
      - name: tokens-contract
        run: dotnet test tests/ControlEasyReborn.ArchitectureTests --filter TokensContract
      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.WEB_DIR }}
      - run: npm run ng -- build --configuration production
        working-directory: ${{ env.WEB_DIR }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test src/ControlEasyReborn.sln

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clean dangling containers
        run: docker compose -f docker/docker-compose.yml down -v --remove-orphans || true
      - name: Start services with dynamic ports
        run: docker compose -f docker/docker-compose.yml up -d --build db api
        env:
          API_PORT: 0
      - name: Wait for API to be ready
        run: |
          ACTUAL_API_PORT=$(docker compose -f docker/docker-compose.yml port api 8080 | cut -d: -f2)
          echo "API is running on port $ACTUAL_API_PORT"
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:$ACTUAL_API_PORT/swagger/v1/swagger.json >/dev/null && exit 0
            sleep 2
          done
          docker compose -f docker/docker-compose.yml logs api
          exit 1
      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.WEB_DIR }}
      - name: Run OpenAPI Check
        run: |
          ACTUAL_API_PORT=$(docker compose -f docker/docker-compose.yml port api 8080 | cut -d: -f2)
          npx ng-openapi-gen --input http://localhost:$ACTUAL_API_PORT/swagger/v1/swagger.json --config ng-openapi-gen.json
          git diff --exit-code -- src/app/api
        working-directory: ${{ env.WEB_DIR }}
      - name: Cleanup Containers
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v --remove-orphans || true

  docker:
    needs: [build, test, openapi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/controleasy-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/controleasy-web:${{ github.sha }}

  smoke:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clean dangling containers
        run: docker compose -f docker/docker-compose.yml down -v --remove-orphans || true
      - name: Start services with dynamic ports
        run: docker compose -f docker/docker-compose.yml up -d --build
        env:
          REVERSE_PROXY_PORT: 0
          REVERSE_PROXY_HTTPS_PORT: 0
          REVERSE_PROXY_API_PORT: 0
          API_PORT: 0
      - name: Wait for API to be ready
        run: |
          ACTUAL_API_PORT=$(docker compose -f docker/docker-compose.yml port api 8080 | cut -d: -f2)
          echo "API is running on port $ACTUAL_API_PORT"
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:$ACTUAL_API_PORT/swagger/v1/swagger.json >/dev/null && exit 0
            sleep 2
          done
          docker compose -f docker/docker-compose.yml logs
          exit 1
      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.WEB_DIR }}
      - run: npx playwright install --with-deps chromium
        working-directory: ${{ env.WEB_DIR }}
      - name: Run E2E tests
        run: |
          ACTUAL_PROXY_PORT=$(docker compose -f docker/docker-compose.yml port reverse-proxy 80 | cut -d: -f2)
          echo "Reverse proxy is running on port $ACTUAL_PROXY_PORT"
          npm run e2e
        working-directory: ${{ env.WEB_DIR }}
        env:
          E2E_BASE_URL: http://localhost:$ACTUAL_PROXY_PORT
      - name: Cleanup Containers
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v --remove-orphans || true
