<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — ControlEasy Reborn</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ce.theme") || "system";
        if (t === "system") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a href="#login" class="skip-link">Skip to login</a>

  <!-- Theme toggle in top-right (per UC-038) -->
  <button class="icon-btn login-theme-toggle" data-theme-toggle aria-label="Toggle theme" data-tooltip="Toggle theme">
    <span data-icon="sun" data-theme-icon-light></span>
    <span data-icon="moon" data-theme-icon-dark hidden></span>
  </button>

  <main id="login" class="login-page" tabindex="-1">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-mark">CE</div>
        <div class="login-brand-text">ControlEasy</div>
      </div>
      <h1 class="login-title">Sign in to ControlEasy</h1>
      <p class="login-subtitle">Use your email and password to access the platform.</p>

      <!-- Error region (aria-live=assertive) -->
      <div id="login-error" class="login-error mb-4" role="alert" aria-live="assertive" hidden>
        <span data-icon="alert"></span>
        <span id="login-error-text">Invalid email or password.</span>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="ce-input-group">
          <label class="ce-input-label" for="login-email">Email</label>
          <div class="ce-input-wrapper">
            <span class="ce-input-prefix" data-icon="user"></span>
            <input id="login-email" name="email" class="ce-input" type="email" autocomplete="email" placeholder="you@controleasy.app" required />
          </div>
        </div>

        <div class="ce-input-group">
          <label class="ce-input-label" for="login-password">Password</label>
          <div class="ce-input-wrapper">
            <span class="ce-input-prefix" data-icon="settings"></span>
            <input id="login-password" name="password" class="ce-input" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6" />
            <button type="button" class="ce-input-suffix" data-password-toggle="login-password" aria-label="Show password" style="background: transparent; border: 0; cursor: pointer; color: var(--color-text-muted);">
              <span data-icon="eye"></span>
            </button>
          </div>
        </div>

        <label class="ce-checkbox" style="margin-top: -8px;">
          <input type="checkbox" id="login-remember" name="remember" />
          <span class="ce-checkbox-box"></span>
          <span>Remember my email</span>
        </label>

        <button id="login-submit" class="ce-button variant-primary size-lg" type="submit" style="margin-top: var(--space-2);">
          <span id="login-submit-text">Sign in</span>
          <span class="ce-spinner size-sm tone-current" id="login-submit-spinner" style="color: white;" hidden></span>
        </button>
      </form>

      <a href="#" class="login-forgot" data-toast="info" data-toast-msg="Check your email for reset instructions.">Forgot password?</a>

      <div class="row row-2 mt-6" style="justify-content: center; gap: var(--space-3); font-size: var(--font-size-xs); color: var(--color-text-muted);">
        <span>Demo: enter any email with "multi" to see the tenant picker.</span>
      </div>
    </div>
  </main>

  <script src="assets/theme.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    document.querySelectorAll("[data-icon]").forEach((el) => {
      const name = el.getAttribute("data-icon");
      el.innerHTML = window.icon(name);
    });
    function updateThemeIcon() {
      const t = document.documentElement.getAttribute("data-theme");
      document.querySelectorAll("[data-theme-icon-light]").forEach((el) => el.hidden = t === "dark");
      document.querySelectorAll("[data-theme-icon-dark]").forEach((el) => el.hidden = t !== "dark");
    }
    updateThemeIcon();
    document.addEventListener("ce:theme-change", updateThemeIcon);
  </script>
</body>
</html>
